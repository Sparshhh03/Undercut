# Keeps the website's predictions up to date without anyone running anything.
# On a schedule, GitHub re-downloads the current season (qualifying, sprint and race results from the
# Jolpica F1 API), retrains the model, rewrites site/data.json and, only if the predictions or results
# actually changed, commits it to main. Vercel then redeploys the site automatically.
#
# Results usually reach the API a few hours after a session ends, so the site follows a few hours
# behind each qualifying / sprint / race. It can also be run by hand: Actions tab > Refresh predictions >
# Run workflow.
name: Refresh predictions

on:
  schedule:
    - cron: "*/30 * * * 5,6,0"   # race weekends (Fri-Sun, UTC): every 30 minutes
    - cron: "15 */6 * * 1-4"     # Mon-Thu: every 6 hours (late results, schedule changes)
  workflow_dispatch:
  push:
    branches: [main]
    paths:                         # model code changed: refresh straight away
      - "f1predict/**"
      - "f1.py"
      - "export_site.py"
      - "requirements.txt"
      - ".github/workflows/refresh-predictions.yml"

permissions:
  contents: write

concurrency:
  group: refresh-predictions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Retrain and export predictions
        run: python export_site.py

      - name: Commit if anything changed
        run: |
          # data.json always gets a new timestamp; only commit when something else changed
          python - <<'EOF'
          import json, subprocess, os
          old = subprocess.run(["git", "show", "HEAD:site/data.json"], capture_output=True, text=True, encoding="utf-8").stdout
          old = json.loads(old) if old else {}
          new = json.load(open("site/data.json", encoding="utf-8"))
          for d in (old, new):
              d.pop("generated_at", None)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"CHANGED={'yes' if old != new else 'no'}\n")
          EOF
          if [ "$CHANGED" = "yes" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json data/
            git commit -m "Refresh predictions ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase
            git push
          else
            echo "No new results or predictions; nothing to commit."
          fi
